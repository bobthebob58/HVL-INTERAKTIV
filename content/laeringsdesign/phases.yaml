# content/laeringsdesign/phases.yaml
# PROPOSAL 2026-10-16 — derived from PUBLIC HVL usage, NOT from the ALU model document.
# Replace/confirm when docs/reference/hvl-modellen-for-laeringsdesign.pdf arrives (spec 04 §1).
# Position: these phases sit at the model's mikronivå (læringsøkt) around a samling;
# they are not "the phases of HVL læringsdesign" (Møgelvang & Isaksen 2025 describe levels
# and the parts kontekst / kunnskap / samskaping, not phases).
#
# Copied from docs/reference/proposals/phases.yaml on 2026-10-28 (S5, D-082), with each phase's `purpose` and
# `canvasPlacement` added from the phase matrix in spec 04 §3 (the attempt policy and placement column).
# Rules for editing (see content/laeringsdesign/README.md):
#   - Change the texts freely; keep the keys on the left of `:` as they are. Every text needs nn, nb and en.
#   - The phase keys forarbeid, underveis and etterarbeid are codes and never change; only the labels do.
#   - `npm run content:check` checks this file; a mistake stops the server's start and names the line and key.
# Spec: PED-001 · Tests: apps/server/test/learningDesign/content/phasesContent.test.ts
version: 1
status: proposed # proposed | confirmed-by-alu
anchor:
  key: samling # synchronous session; shown on the studio page, never authored
  authored: false
  label:
    nn: Samling # medium — HVL: "samling", "samlingar", "nettsamling"
    nb: Samling # medium — HVL (nb pages): "samlingen"
    en: Session # medium — HVL en: "two sessions with associated pre- and post-work"
  description:
    nn: Den synkrone økta – seminar, førelesing, lab eller nettsamling.
    nb: Den synkrone økten – seminar, forelesning, lab eller nettsamling.
    en: The synchronous session – seminar, lecture, lab or online session.
phases:
  - key: forarbeid
    order: 1
    position: before-samling
    label:
      nn: Forarbeid # medium — HVL nn: "før- og etterarbeid"; module page heading "Forarbeid:"
      nb: Forarbeid # medium — same word in nb
      en: Pre-work # medium — HVL en: "pre- and post-work"
    description:
      nn: Asynkront arbeid før samlinga. Aktiver forkunnskapar, møt nøkkelomgrep og avdekk misoppfatningar.
      nb: Asynkront arbeid før samlingen. Aktiver forkunnskaper, møt nøkkelbegreper og avdekk misoppfatninger.
      en: Asynchronous work before the session. Activate prior knowledge, meet key concepts and surface misconceptions.
    # Spec 04 §3: "Activate prior knowledge; meet threshold concepts; surface misconceptions before teaching".
    purpose:
      nn: Aktivere forkunnskapane til studentane, møte terskelomgrep og avdekkje misoppfatningar før undervisninga.
      nb: Aktivere forkunnskapene til studentene, møte terskelbegreper og avdekke misoppfatninger før undervisningen.
      en: Activate students’ prior knowledge, meet threshold concepts and surface misconceptions before the teaching.
    # Spec 04 §3: "In the module before the seminar. Unlimited retries; Show solution on. The teacher reviews
    # Før samlinga insight the evening before."
    canvasPlacement:
      nn: >-
        I Canvas-modulen før seminaret. Studentane har uavgrensa tal på forsøk og kan sjå løysinga. Læraren ser
        gjennom innsikta «Før samlinga» kvelden før.
      nb: >-
        I Canvas-modulen før seminaret. Studentene har ubegrenset antall forsøk og kan se løsningen. Læreren ser
        gjennom innsikten «Før samlingen» kvelden før.
      en: >-
        In the Canvas module before the seminar. Students have unlimited attempts and can see the solution. The
        teacher reviews the “Before the session” insight the evening before.
  - key: underveis # key kept stable; label changed to HVL's public term
    order: 2
    position: between-samlingar
    label:
      nn: Mellomarbeid # medium — HVL module pages (FD6, FD9, FD20): "mellomarbeid"
      nb: Mellomarbeid # medium — same word in nb
      en: Intermediate work # medium — HVL en (FD6): "intermediate work"
    description:
      nn: Asynkront arbeid mellom samlingane og i praksis. Bearbeid, bruk og øv på profesjonell dømmekraft.
      nb: Asynkront arbeid mellom samlingene og i praksis. Bearbeid, bruk og øv på profesjonell dømmekraft.
      en: Asynchronous work between sessions and during placement. Process, apply and practise professional judgement.
    # Spec 04 §3: "Deepen integration; practise professional judgement (profesjonell dømmekraft, didaktisk skjønn)
    # on realistic cases".
    purpose:
      nn: Fordjupe og knyte saman kunnskap, og øve på profesjonell dømmekraft og didaktisk skjønn i realistiske case.
      nb: Fordype og knytte sammen kunnskap, og øve på profesjonell dømmekraft og didaktisk skjønn i realistiske caser.
      en: >-
        Deepen and connect knowledge, and practise professional judgement (profesjonell dømmekraft, didaktisk
        skjønn) on realistic cases.
    # Spec 04 §3: "One or two interactive items per Canvas page. Resume enabled."
    canvasPlacement:
      nn: Ei eller to interaktive oppgåver per Canvas-side. Studentane kan halde fram der dei slapp.
      nb: Én eller to interaktive oppgaver per Canvas-side. Studentene kan fortsette der de slapp.
      en: One or two interactive tasks per Canvas page. Students can carry on where they left off.
  - key: etterarbeid
    order: 3
    position: after-samling
    label:
      nn: Etterarbeid # medium — HVL nn: "før- og etterarbeid"
      nb: Etterarbeid # medium — HVL nb: "Etter samlingen …"
      en: Post-work # medium — HVL en: "pre- and post-work"
    description:
      nn: Konsolidering etter samlinga – repetisjon, gjenhenting og eigenvurdering mot læringsutbyttet.
      nb: Konsolidering etter samlingen – repetisjon, gjenhenting og egenvurdering mot læringsutbyttet.
      en: Consolidation after the session – spaced retrieval and self-assessment against the learning outcomes.
    # Spec 04 §3: "Consolidate through spaced retrieval; check the learning outcomes (læringsutbytte)".
    purpose:
      nn: Konsolidere gjennom spreidd gjenhenting, og sjekke kor langt studentane har kome mot læringsutbyttet.
      nb: Konsolidere gjennom spredt gjenhenting, og sjekke hvor langt studentene har kommet mot læringsutbyttet.
      en: Consolidate through spaced retrieval practice, and check progress towards the learning outcomes.
    # Spec 04 §3: "Graded through AGS with the mastery or best policy (LTI-012), unlimited attempts. Suggested
    # repetition dates (PROD-014)." Scores are formative (CLAUDE.md §1), never exam evidence.
    canvasPlacement:
      nn: >-
        Poengsummen går til Canvas som formativ vurdering, etter beste forsøk eller meistring, og studentane har
        uavgrensa tal på forsøk. Dei får forslag til datoar for repetisjon.
      nb: >-
        Poengsummen går til Canvas som formativ vurdering, etter beste forsøk eller mestring, og studentene har
        ubegrenset antall forsøk. De får forslag til datoer for repetisjon.
      en: >-
        The score goes to Canvas as formative assessment, by best attempt or mastery, and students have unlimited
        attempts. They get suggested dates for repetition.
