# content/laeringsdesign/references.yaml — the full references the læringsdesign guide and the patterns cite.
#
# Why: every factual claim on the guide page has a reference (spec 04 §3 and PED-002). A guide text or a pattern
#      cites one as [@key], and the page ends with the full references it cites (D-083).
# Source: the research table in spec 04 §3 (author, year, venue). Titles, publishers and the remaining details were
#         written out on 2026-10-28 and are NOT checked against the sources yet: every reference says `verify: true`
#         until ALU has checked it (open question Q17). No DOIs or page numbers are added that were not in the
#         repository's own sources.
# Rules for editing (see content/laeringsdesign/README.md):
#   - A key is lower-case letters, digits and hyphens, like guo2014 (first author and year). Never rename a key that
#     a guide or a pattern cites; `npm run content:check` reports a citation of a key that is not listed here.
#   - `text` is the whole reference as plain text (no Markdown, no italics), at most 600 characters.
#   - `language` is the language the reference is written in: leave it out for English, write `language: nb` (or
#     nn, sv, da, de …) for any other, so screen readers read it in the right language.
#   - Set `verify: false` only after checking the reference against the source.
# Spec: PED-002 · Tests: apps/server/test/learningDesign/content/referencesContent.test.ts
version: 1
references:
  # Segment and retrieve
  mayer2009:
    text: >-
      Mayer, R. E. (2009). Multimedia learning (2nd ed.). Cambridge University Press.
    verify: true
  guo2014:
