# content/h5p-tekstar/library-texts.nb.yaml: HVL's Bokmål texts for the H5P content types, laid over the libraries'
# own nb.json (H5P-008, D-111). New activities get these texts; activities already saved keep theirs.
#
# DRAFT, not reviewed by HVL's language advisers or ALU (open questions Q2 and Q17).
# Source: the English text of each library (`en`, as `npm run content:check` reads it from the installed library) and
#   the Bokmål wording the libraries already use elsewhere (Sjekk, Vis svar, Prøv igjen, Send inn).
# How to edit: content/h5p-tekstar/README.md. Each entry gives `en`, the library's English text, and `nb`, HVL's text.
#   Change only `nb`; `en` must stay the library's own text. Run `npm run content:check`.
