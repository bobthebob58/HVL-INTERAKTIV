# content/h5p-tekstar/library-texts.nn.yaml: HVL's Nynorsk texts for the H5P content types, laid over the libraries'
# own nn.json (H5P-008, D-111). New activities get these texts; activities already saved keep theirs.
#
# DRAFT, not reviewed by HVL's language advisers or ALU (open questions Q2 and Q17).
# Source: the English text of each library (`en`, as `npm run content:check` reads it from the installed library) and
#   the Nynorsk wording the libraries already use elsewhere (Sjekk, Vis svar, Prøv igjen, Send inn).
# How to edit: content/h5p-tekstar/README.md. Each entry gives `en`, the library's English text, and `nn`, HVL's text.
#   Change only `nn`; `en` must stay the library's own text. Run `npm run content:check`.
status: draft
