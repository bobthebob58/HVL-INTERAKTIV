<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100">
  <!-- Attack: an external <use href="https://...#x"> pulls in another document's (possibly scripted) content. -->
  <rect id="keep" width="10" height="10" fill="#004357"/>
  <use href="https://attacker.example/sprite.svg#x"/>
  <use xlink:href="https://attacker.example/sprite.svg#y"/>
</svg>
