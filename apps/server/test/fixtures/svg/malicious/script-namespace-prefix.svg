<svg xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Attack: svg:script with a namespace prefix; an XML parser runs it, a name-based filter misses it. -->
  <rect id="keep" width="10" height="10" fill="#004357"/>
  <svg:script>alert(document.domain)</svg:script>
</svg>
