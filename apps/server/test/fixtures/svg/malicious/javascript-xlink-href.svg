<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100">
  <!-- Attack: a link with a javascript: URL in xlink:href (SVG 1.1 style) runs script when clicked. -->
  <a xlink:href="javascript:alert(document.domain)"><rect id="keep" width="10" height="10" fill="#004357"/></a>
</svg>
