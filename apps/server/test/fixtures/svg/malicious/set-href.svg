<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
  <!-- Attack: <set attributeName="href" to="javascript:..."> rewrites a harmless link after the page loads. -->
  <a href="#keep"><set attributeName="href" to="javascript:alert(document.domain)"/><rect id="keep" width="10" height="10" fill="#004357"/></a>
</svg>
