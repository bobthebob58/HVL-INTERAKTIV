# Dependabot: grouped monthly pull requests per ecosystem for minor and patch updates (SEC-007; owner, 2026-10-28);
# for npm two of them, playwright-core in a group of its own (D-148).
# WHY: major versions change behaviour and are upgraded on purpose, with a decision and the full gate, not by a bot;
# an advisory that only a major version fixes still fails `npm run check:audit` in CI, so it cannot go unnoticed.
# Every update still goes through review, the exact-pin check and the audit check in CI.
# Between two runs, .github/workflows/audit.yml runs the audit check once a day on the default branch (D-145), so a
# new advisory does not wait for the next month or the next push.
# The actions are named by commit with the version as a comment (`npm run check:workflows`); Dependabot updates both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    open-pull-requests-limit: 3
    groups:
      # WHY: Playwright's version names the Chromium the image copies (deploy/Dockerfile) and the browser the
      # cookie tests were proven on (D-065), so it is updated as a step of its own. A group of its own gives it its
      # own monthly pull request: it stays open as the reminder and no longer holds the other updates back (D-148).
      playwright:
        patterns: ['playwright-core']
        update-types: [minor, patch]
      minor-and-patch:
        exclude-patterns: ['playwright-core']
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  # WHY: the image's base images are pinned by digest (D-110); this proposes new digests for deploy/Dockerfile, which
  # the Docker smoke test (docker.yml) then builds and checks.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # WHY: Ubuntu's version is a choice between long-term releases, not a number to raise. 24.04 has security
      # support until 2029; a release between two long-term ones loses its support after nine months, and its
      # packages then leave the archive, so the image cannot be built on it (24.10, D-148). A new digest of 24.04
      # is a new copy of the same version and is still proposed.
      - dependency-name: 'ubuntu'
        update-types: ['version-update:semver-minor']
