# Dependabot: one grouped pull request a month per ecosystem for minor and patch updates (SEC-007; owner, 2026-10-28).
# WHY: major versions change behaviour and are upgraded on purpose, with a decision and the full gate, not by a bot;
# an advisory that only a major version fixes still fails `npm run check:audit` in CI, so it cannot go unnoticed.
# Every update still goes through review, the exact-pin check and the audit check in CI.
# Between two runs, .github/workflows/audit.yml runs the audit check once a day on the default branch (D-145), so a
# new advisory does not wait for the next month or the next push.
# The actions are named by commit with the version as a comment (`npm run check:workflows`); Dependabot updates both.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    versioning-strategy: increase
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  # WHY: the image's base images are pinned by digest (D-110); this proposes new digests for deploy/Dockerfile, which
  # the Docker smoke test (docker.yml) then builds and checks.
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
