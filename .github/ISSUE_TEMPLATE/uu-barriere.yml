# Issue form for an accessibility barrier found in the pilot (D-101's amendment of 2026-11-05, problem reporting).
# Text is Nynorsk at B1 level, for testers; the guide is docs/testing/rapportere-problem.md.
# PRIVACY: the required check comes first, and no field asks for a name or contact detail (DATA-010).
# A11Y: the set-ups are those of docs/accessibility/manual-test-protocol.md §3, whose dated results stay in
# docs/accessibility/results/ (UD-031, D-079). Checked by the tests in tools/issue-forms/.
name: Barriere for universell utforming
description: Noko hindrar deg når du brukar tastatur, skjermlesar, forstørring eller anna hjelpemiddel. Eller noko er vanskeleg å sjå, høyre eller forstå.
title: 'UU-barriere: '
labels: ['type: universell utforming', 'treng vurdering']
body:
  - type: markdown
    attributes:
      value: |
        Takk for at du melder frå! Er du usikker, les [rettleiinga for testarar](https://github.com/bobthebob58/HVL-INTERAKTIV/blob/HEAD/docs/testing/rapportere-problem.md).

        **Ikkje skriv personopplysningar.** Andre kan lese denne saka. Skriv ikkje namn på studentar eller kollegaer, e-postadresser, Feide-ID-ar, fødselsnummer eller studentnummer. Lim ikkje inn svar som studentar har skrive. Dekk over namn og bilete på skjermbileta.

        **Er det eit tryggleiksproblem?** Då skal du ikkje skrive det her. Meld frå privat, slik [tryggleiksrettleiinga](https://github.com/bobthebob58/HVL-INTERAKTIV/security/policy) seier.
  - type: checkboxes
    id: privacy
    attributes:
      label: Personopplysningar
      options:
        - label: Saka mi har ingen namn, e-postadresser, Feide-ID-ar, fødselsnummer, studentnummer eller svar frå studentar, og skjermbileta mine viser ingen.
          required: true
  - type: input
    id: assistive-technology
    attributes:
      label: Hjelpemiddel og versjon
      description: Til dømes skjermlesar, berre tastatur, forstørring eller talestyring. Skriv også innstillingar som du har endra. Du treng ikkje skrive kvifor du brukar det.
      placeholder: NVDA 2025.3, standardinnstillingar
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Nettlesar og versjon
      description: Du finn versjonen under «Om» i menyen til nettlesaren.
      placeholder: Firefox 144
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Eining
      description: Kva slags datamaskin, nettbrett eller telefon, og kva for operativsystem.
      placeholder: iPhone 13 med iOS 18
    validations:
      required: true
  - type: input
    id: zoom
    attributes:
      label: Zoom og tekststorleik
      description: Skriv «100 %» om du ikkje har endra noko.
      placeholder: 400 %
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Kva gjorde du?
      description: Skriv eitt steg på kvar linje. Skriv kva tastar du brukte, eller kva du gjorde med hjelpemiddelet.
      placeholder: |
        1. Eg opna aktiviteten frå modulen i Canvas.
        2. Eg gjekk til svaralternativa med Tab.
        3. Eg valde svaret B med mellomromstasten og trykte Enter på «Sjekk».
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kva venta du å høyre, sjå eller kunne gjere?
      placeholder: Eg venta at skjermlesaren las opp om svaret var rett eller feil.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Kva høyrde eller såg du i staden?
      description: Skriv det skjermlesaren las opp, ord for ord om du kan.
      placeholder: Skjermlesaren sa berre «knapp». Eg fekk ikkje vite om svaret var rett.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: Kom du vidare på ein annan måte?
      description: Skriv kva du gjorde. Skriv «nei» om du ikkje kom vidare.
  - type: dropdown
    id: place
    attributes:
      label: Kvar var du?
      description: Vel sida eller fana der barrieren var. Portalen er HVL Interaktiv utanfor Canvas, når du loggar inn med Feide.
      options:
        - Startsida i portalen
        - Innlogging med Feide
        - Ny aktivitet
        - 'Aktivitetssida: Spel'
        - 'Aktivitetssida: Rediger'
        - 'Aktivitetssida: Læringsdesign'
        - 'Aktivitetssida: Deling'
        - 'Aktivitetssida: Sjekk og publiser'
        - 'Aktivitetssida: Innsikt'
        - 'Aktivitetssida: Poeng til Canvas'
        - 'Læringsdesign: mønster og rettleiing'
        - 'Læringsdesign: planleggar'
        - Innhaldsbank
        - Pedagogisk mappe
        - Hjelp eller Personvern
        - 'Canvas: Vel aktivitet (når du legg til i ein modul)'
        - 'Canvas: Spel'
        - 'Canvas: Rediger'
        - 'Canvas: Innsikt'
        - 'Canvas: Poeng til Canvas'
        - Anna, eller veit ikkje
    validations:
      required: true
  - type: dropdown
    id: activity-type
    attributes:
      label: Kva for aktivitetstype?
      description: Typen står på startsida i portalen. Vel «Veit ikkje» om du ikkje ser han.
      options:
        - Gjeld ikkje ein aktivitet
        - Kurspresentasjon
        - Interaktiv video
        - Spørsmålssett
        - Interaktiv bok
        - Kolonne
        - Dra orda
        - Fleirval
        - Fyll inn orda
        - Bilete med klikkpunkt
        - Forgreina scenario
        - Veit ikkje
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Skjermbilete
      description: Dra eller lim inn eitt eller fleire bilete. Dekk over namn, e-post og profilbilete først. Canvas kan vise namnet og biletet ditt.
  - type: dropdown
    id: severity
    attributes:
      label: Kor alvorleg er det?
      description: Vel det øvste nivået som passar. Kjem nokon ikkje vidare i det heile, er det nivå 1.
      options:
        - '1 – Kritisk: nokon kan ikkje bruke det, eller det gjeld personvern eller tryggleik'
        - '2 – UU-barriere: nokon blir hindra eller går glipp av informasjon, men kan halde fram'
        - '3 – Kosmetisk: det ser feil ut, men alle kan bruke det'
    validations:
      required: true
  - type: input
    id: wcag
    attributes:
      label: WCAG-kriterium, om du veit det
      placeholder: 1.4.3 Kontrast
  - type: dropdown
    id: protocol-setup
    attributes:
      label: Testa du etter testprotokollen til HVL?
      description: Berre for testarar som følgjer protokollen for manuell testing.
      options:
        - Nei
        - 'AT-1: NVDA og Firefox på Windows'
        - 'AT-2: JAWS og Chrome på Windows'
        - 'AT-3: VoiceOver og Safari på iOS'
        - 'KB: berre tastatur'
        - 'Z400: zoom 400 %'
        - 'PDF: PAC og NVDA med Acrobat Reader'
        - Anna oppsett
  - type: input
    id: result-file
    attributes:
      label: Resultatfil
      description: Namnet på den daterte fila i docs/accessibility/results/, om du har ei.
      placeholder: 2026-11-20-v0.4.0-AT-1.md
  - type: checkboxes
    id: retest
    attributes:
      label: Ny test
      options:
        - label: Eg kan teste på nytt med same hjelpemiddel når barrieren er retta.
